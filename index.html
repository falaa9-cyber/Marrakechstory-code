  <!--
    Inline guard: if React / Babel fail to load (CDN outage, blocked
    extension, integrity-hash mismatch in strict browsers), we show a
    visible error and a reload button instead of a blank white page.
  -->
  <style>
    .ms-boot-error {
      position: fixed; inset: 0;
      display: none;
      align-items: center; justify-content: center;
      background: #fbfbfd; color: #1d1d1f; z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px; text-align: center;
    }
    .ms-boot-error.is-visible { display: flex; }
    .ms-boot-error-box { max-width: 380px; }
    .ms-boot-error h2 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.02em; }
    .ms-boot-error p  { font-size: 14px; color: #6e6e73; line-height: 1.55; margin: 0 0 18px; }
    .ms-boot-error button {
      padding: 12px 22px; border-radius: 999px;
      background: #e1432a; color: #fff; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
  </style>
  <style id="ms-intro-style">
    #ms-intro { position: fixed; inset: 0; z-index: 100000; display: flex; align-items: center; justify-content: center; overflow: hidden;
      background: radial-gradient(120% 120% at 50% 38%, #3a2017 0%, #1c100b 55%, #0a0504 100%);
      transition: opacity .8s cubic-bezier(.4,0,.2,1), visibility .8s; }
    /* soft drifting brand-colour orbs */
    #ms-intro::before, #ms-intro::after { content: ""; position: absolute; border-radius: 50%; filter: blur(64px); opacity: .45; pointer-events: none; }
    #ms-intro::before { width: 48vmax; height: 48vmax; left: -14vmax; top: -14vmax; background: radial-gradient(circle, #e0432a 0%, transparent 70%); animation: msOrbA 7s ease-in-out infinite; }
    #ms-intro::after  { width: 42vmax; height: 42vmax; right: -12vmax; bottom: -12vmax; background: radial-gradient(circle, #d2901f 0%, transparent 70%); animation: msOrbB 8s ease-in-out infinite; }
    #ms-intro.ms-intro-hide { opacity: 0; visibility: hidden; pointer-events: none; }
    #ms-intro.ms-intro-hide .ms-intro-stage { transform: scale(1.09); }
    .ms-intro-stage { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 16px; transition: transform .8s cubic-bezier(.4,0,.2,1); }
    .ms-intro-logo-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
    .ms-intro-glow { position: absolute; width: 150%; height: 150%; border-radius: 50%; background: radial-gradient(circle, rgba(224,67,42,.55) 0%, rgba(224,67,42,0) 62%); filter: blur(26px); opacity: 0; animation: msGlow 1.8s ease-out .25s both; }
    .ms-intro-logo { position: relative; display: block; width: min(34vw, 152px); height: auto; filter: drop-shadow(0 16px 54px rgba(0,0,0,.6)); animation: msLogoIn 1.25s cubic-bezier(.16,.72,.18,1) both; }
    .ms-intro-word { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(26px, 5vw, 46px); letter-spacing: .045em; color: #fff; opacity: 0; white-space: nowrap; animation: msWordIn 1.05s cubic-bezier(.2,.7,.2,1) .7s both; }
    .ms-intro-word em { font-style: italic; font-weight: 500; color: #ef6a4f; }
    .ms-intro-line { height: 2px; width: 0; border-radius: 2px; background: linear-gradient(90deg, transparent, #e0432a 50%, transparent); animation: msLineIn .9s cubic-bezier(.2,.7,.2,1) 1.2s both; }
    @keyframes msLogoIn { 0% { opacity: 0; transform: scale(.5); filter: blur(18px) drop-shadow(0 16px 54px rgba(0,0,0,.6)); } 62% { opacity: 1; transform: scale(1.07); filter: blur(0) drop-shadow(0 16px 54px rgba(0,0,0,.6)); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes msGlow { 0% { opacity: 0; transform: scale(.55); } 55% { opacity: .95; transform: scale(1.06); } 100% { opacity: .5; transform: scale(1); } }
    @keyframes msWordIn { 0% { opacity: 0; letter-spacing: .55em; transform: translateY(10px); } 100% { opacity: 1; letter-spacing: .045em; transform: translateY(0); } }
    @keyframes msLineIn { 0% { width: 0; opacity: 0; } 100% { width: 170px; opacity: 1; } }
    @keyframes msOrbA { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(6vmax,4vmax) scale(1.1); } }
    @keyframes msOrbB { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-5vmax,-4vmax) scale(1.12); } }
    /* 3D floating travel graphics */
    .ms-intro-sky { position: absolute; inset: 0; z-index: 1; pointer-events: none; perspective: 760px; transform-style: preserve-3d; }
    .ms-intro-emoji { position: absolute; font-size: clamp(24px, 3.6vw, 44px); line-height: 1; opacity: 0; will-change: transform, opacity;
      filter: drop-shadow(0 10px 22px rgba(0,0,0,.5)); transform-style: preserve-3d;
      animation: msEmojiIn 1.1s ease-out var(--d, 0s) both, msFloat3d var(--dur, 9s) ease-in-out var(--d, 0s) infinite; }
    @keyframes msEmojiIn { 0% { opacity: 0; transform: scale(.4) translateZ(-120px); } 100% { opacity: .92; transform: scale(1) translateZ(0); } }
    @keyframes msFloat3d {
      0%   { transform: translate3d(0,0,0)        rotateY(0deg)   rotateX(0deg);   }
      25%  { transform: translate3d(16px,-26px,50px) rotateY(22deg)  rotateX(9deg);  }
      50%  { transform: translate3d(-12px,-10px,-40px) rotateY(-18deg) rotateX(-7deg); }
      75%  { transform: translate3d(10px,20px,24px) rotateY(14deg)  rotateX(6deg);  }
      100% { transform: translate3d(0,0,0)        rotateY(0deg)   rotateX(0deg);   }
    }
    /* the plane gets its own flight path across the sky */
    .ms-intro-plane { position: absolute; top: 16%; left: -12%; font-size: clamp(26px, 3.8vw, 46px); opacity: 0;
      filter: drop-shadow(0 10px 22px rgba(0,0,0,.5)); animation: msPlaneFly 9s linear .4s infinite; }
    @keyframes msPlaneFly {
      0%   { opacity: 0; transform: translate3d(0,0,0) rotate(8deg); }
      8%   { opacity: .95; }
      92%  { opacity: .95; }
      100% { opacity: 0; transform: translate3d(128vw,-22vh,0) rotate(8deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ms-intro-logo, .ms-intro-word, .ms-intro-line, .ms-intro-glow, #ms-intro::before, #ms-intro::after,
      .ms-intro-emoji, .ms-intro-plane { animation: none !important; }
      .ms-intro-word { opacity: 1; letter-spacing: .045em; } .ms-intro-line { width: 170px; opacity: 1; } .ms-intro-glow { opacity: .5; }
      .ms-intro-emoji { opacity: .9; } .ms-intro-plane { opacity: .9; left: 16%; }
    }
  </style>

<body>
  <div id="ms-intro" aria-hidden="true">
    <div class="ms-intro-sky">
      <span class="ms-intro-emoji" style="top:21%; left:11%;  --d:.15s; --dur:8.5s;">🐪</span>
      <span class="ms-intro-emoji" style="top:19%; right:13%; --d:.45s; --dur:9.5s;">🕌</span>
      <span class="ms-intro-emoji" style="bottom:18%; left:15%; --d:.7s; --dur:10s;">🚐</span>
      <span class="ms-intro-emoji" style="bottom:21%; right:16%; --d:.3s; --dur:9s;">🧳</span>
      <span class="ms-intro-emoji" style="top:40%; left:6%;  --d:.9s; --dur:11s;">🧭</span>
      <span class="ms-intro-emoji" style="top:44%; right:7%; --d:.55s; --dur:10.5s;">🌴</span>
      <span class="ms-intro-emoji" style="top:11%; left:43%; --d:1.05s; --dur:9.2s;">☀️</span>
      <span class="ms-intro-emoji" style="bottom:9%; left:41%; --d:.8s; --dur:10.8s;">🏜️</span>
      <span class="ms-intro-emoji" style="bottom:27%; left:30%; --d:1.2s; --dur:9.8s;">🐫</span>
      <span class="ms-intro-emoji" style="bottom:30%; right:28%; --d:.65s; --dur:11.4s;">🛺</span>
      <span class="ms-intro-plane">✈️</span>
    </div>
    <div class="ms-intro-stage">
      <div class="ms-intro-logo-wrap"><span class="ms-intro-glow"></span><img class="ms-intro-logo" src="assets/logo.png" alt="MarrakechStory" /></div>
      <div class="ms-intro-word">Marrakech<em>Story</em></div>
      <div class="ms-intro-line"></div>
    </div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('ms-intro'); if (!el) return;
      try { if (sessionStorage.getItem('ms_intro_seen')) { el.parentNode.removeChild(el); return; } sessionStorage.setItem('ms_intro_seen', '1'); } catch (e) {}
      // Keep the intro up until the app has actually painted (no white flash),
      // with a minimum on-screen time so the animation always plays, and a
      // hard cap so we never trap the user behind the splash.
      var start = Date.now(), MIN = 2200, MAX = 9000;
      function ready() {
        var r = document.getElementById('root');
        return r && r.children.length > 0 && r.textContent.trim() !== '';
      }
      function hide() {
        el.classList.add('ms-intro-hide');
        setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 850);
      }
      (function tick() {
        var waited = Date.now() - start;
        if ((ready() && waited >= MIN) || waited >= MAX) { hide(); return; }
        setTimeout(tick, 120);
      })();
    })();
  </script>

  <div id="root"></div>

  <!-- Boot-error fallback shown by the guard below if React never paints -->
  <div id="ms-boot-error" class="ms-boot-error" role="alert">
    <div class="ms-boot-error-box">
      <h2>Loading Marrakech Story…</h2>
      <p>Your browser couldn't finish loading the page. This is usually a network issue or a strict browser extension. Try a hard refresh.</p>
      <button type="button" onclick="location.reload(true)">Reload</button>
    </div>
  </div>

  <!--

    Both serve the exact same pinned version so behaviour is identical.
    The inline fallback checks window.React / window.Babel immediately

    if the global is missing, then halts further work until it loads.
  -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>

  <!-- Leaflet (free OpenStreetMap maps — no API key) for the listing-detail map -->

  <!--
    Boot-watchdog: gives the app 6 seconds to paint anything inside #root.
    If it's still empty (CDN blocked, JSX failed to transform, syntax error),
    show the boot-error overlay instead of a permanently blank page.
  -->
  <script>
    (function () {
      var ROOT = document.getElementById('root');
      var ERR  = document.getElementById('ms-boot-error');
      // Surface any uncaught script error to the console so we can diagnose
      // remotely if a real user reports a blank page.
      window.addEventListener('error', function (e) {
        try { console.error('[MS_BOOT] script error:', e.message, e.filename, e.lineno); } catch {}
      });
      setTimeout(function check() {
        if (!ROOT) return;
        if (ROOT.children.length === 0 || ROOT.textContent.trim() === '') {
          ERR && ERR.classList.add('is-visible');
        }
      }, 6000);
    })();
  </script>
</body>
