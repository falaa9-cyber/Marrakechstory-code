  <script>
    (function () {
      var el = document.getElementById('ms-intro'); if (!el) return;
      try { if (sessionStorage.getItem('ms_intro_seen')) { el.parentNode.removeChild(el); return; } sessionStorage.setItem('ms_intro_seen', '1'); } catch (e) {}
      // Keep the intro up until the app has actually painted (no white flash),
      // with a minimum on-screen time so the animation always plays, and a
      // hard cap so we never trap the user behind the splash.
      var start = Date.now(), MIN = 2200, MAX = 9000;
      function ready() {
        var r = document.getElementById('root');
        return r && r.children.length > 0 && r.textContent.trim() !== '';
      }
      function hide() {
        el.classList.add('ms-intro-hide');
        setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 850);
      }
      (function tick() {
        var waited = Date.now() - start;
        if ((ready() && waited >= MIN) || waited >= MAX) { hide(); return; }
        setTimeout(tick, 120);
      })();
    })();
  </script>

      <h1>MarrakechStory — Private Morocco Tours &amp; Tailor-Made Trips</h1>
      <p>MarrakechStory is a boutique travel agency run by a Norwegian-Moroccan team based in Marrakech. We design private, tailor-made journeys across Morocco — boutique riads in the Marrakech medina, the Agafay stone desert, the Sahara dunes at Merzouga and Zagora, the High Atlas Mountains, Ouarzazate and Aït Ben Haddou, and the Atlantic coast at Essaouira and Taghazout.</p>
      <h2>What we offer</h2>
      <ul>
        <li><strong>Private Morocco tours &amp; multi-day itineraries</strong> — 3 to 8 days, fully customisable, with a private English-speaking driver.</li>
        <li><strong>Desert experiences</strong> — Agafay luxury camps, Sahara overnight camps, camel rides and quad/buggy adventures.</li>
        <li><strong>Marrakech experiences</strong> — guided medina &amp; souk tours, cooking classes, hammam &amp; spa, palaces and gardens.</li>
        <li><strong>Day trips &amp; excursions</strong> — Ourika Valley, Ouzoud Waterfalls, Essaouira, Ouarzazate &amp; Aït Ben Haddou.</li>
        <li><strong>Family, romance and honeymoon packages</strong> tailored to you.</li>
      </ul>
      <h2>Why MarrakechStory</h2>
      <p>Licensed Moroccan tour operator, rated 5.0★ on Google. Norwegian-Moroccan team, concierge support on the ground, and every trip built around you.</p>
      <h2>Contact &amp; booking</h2>
      <p>Email: <a href="mailto:Marrakechstory@outlook.com">Marrakechstory@outlook.com</a> · Phone/WhatsApp: +47 457 74 743 · Instagram: <a href="https://www.instagram.com/marrakechstory">@marrakechstory</a></p>

  <!-- ── Auto-syncing trip structured data (TouristTrip ItemList from live data) ── -->
  <script>
    (function () {
      function injectTripsLD() {
        var trips = window.MS_ITINERARIES;
        if (!trips || !trips.length) return false;
        if (document.getElementById('ms-trips-ld')) return true;
        var tx = function (v) { return (v && (v.en || v.no || v.fr)) || (typeof v === 'string' ? v : ''); };
        var items = trips.slice(0, 40).map(function (t, i) {
          var price = Math.round((t.priceFromEUR || 0) * 1.4); // display markup ≈ shown price
          var item = {
            "@type": "TouristTrip",
            "name": tx(t.title),
            "description": tx(t.teaser),
            "url": "https://marrakechstory.com/#itineraries",
            "provider": { "@id": "https://marrakechstory.com/#org" }
          };
          if (t.img) item.image = "https://marrakechstory.com/" + t.img;
          if (price) item.offers = { "@type": "Offer", "price": String(price), "priceCurrency": "EUR", "availability": "https://schema.org/InStock" };
          return { "@type": "ListItem", "position": i + 1, "item": item };
        });
        var ld = { "@context": "https://schema.org", "@type": "ItemList", "name": "Morocco trips & itineraries by MarrakechStory", "itemListElement": items };
        var s = document.createElement('script');
        s.type = 'application/ld+json'; s.id = 'ms-trips-ld';
        s.textContent = JSON.stringify(ld);
        document.head.appendChild(s);
        return true;
      }
      var tries = 0;
      var iv = setInterval(function () { tries++; if (injectTripsLD() || tries > 40) clearInterval(iv); }, 250);
    })();
  </script>

  <!--
    Boot-watchdog: gives the app 6 seconds to paint anything inside #root.
    If it's still empty (CDN blocked, JSX failed to transform, syntax error),
    show the boot-error overlay instead of a permanently blank page.
  -->
  <script>
    (function () {
      var ROOT = document.getElementById('root');
      var ERR  = document.getElementById('ms-boot-error');
      // Surface any uncaught script error to the console so we can diagnose
      // remotely if a real user reports a blank page.
      window.addEventListener('error', function (e) {
        try { console.error('[MS_BOOT] script error:', e.message, e.filename, e.lineno); } catch {}
      });
      setTimeout(function check() {
        if (!ROOT) return;
        if (ROOT.children.length === 0 || ROOT.textContent.trim() === '') {
          ERR && ERR.classList.add('is-visible');
        }
      }, 6000);
    })();
  </script>
